name: Desktop v2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          version: 0.2.8
          node-version: 24.20.0
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.93.0
      - name: Install Linux webview prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install the vendored versioned engine client
        run: vp install --frozen-lockfile
      - name: Check desktop types and journeys
        run: |
          vp run check
          vp exec vitest run --config vitest.v2.config.ts
          vp exec node --test scripts/stage-v2.test.mjs scripts/build-public.test.mjs scripts/frontend-notices.test.mjs scripts/materials-contract.test.mjs scripts/final-materials-contract.test.mjs scripts/notarized-materials-contract.test.mjs
      - name: Build the independent frontend
        run: vp build --config vite.v2.config.ts
      - name: Check the native v2 shell
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"build":{"frontendDist":"../dist-v2"}}'
        run: cargo test --locked --features v2
# Packaged acceptance uses explicit versioned engine/tool/provider artifacts via
# scripts/stage-v2.mjs. No sibling repository is required by this build.
